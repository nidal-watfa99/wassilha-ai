name: Unzip project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          mkdir -p /tmp/extract
          unzip -o -q wassilha-ai-fixed.zip -d /tmp/extract
          SRC=$(find /tmp/extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
          rm -rf "$SRC/.github"
          cp -a "$SRC"/. .
          rm -f wassilha-ai-fixed.zip

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Extract wassilha-ai-fixed.zip"
            git push
          fi
